# Run Datadog Synthetic tests on pushes and pull requests.
# Configure both DD_API_KEY and DD_APP_KEY in GitHub Actions secrets to enable tests.
# Without either secret, the workflow records an explicit skip instead of failing.

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check Datadog credentials
      id: datadog_credentials
      shell: bash
      env:
        DD_API_KEY_VALUE: ${{ secrets.DD_API_KEY }}
        DD_APP_KEY_VALUE: ${{ secrets.DD_APP_KEY }}
      run: |
        if [[ -n "$DD_API_KEY_VALUE" && -n "$DD_APP_KEY_VALUE" ]]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run Datadog Synthetic tests
      if: steps.datadog_credentials.outputs.configured == 'true'
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
      with:
        api_key: ${{ secrets.DD_API_KEY }}
        app_key: ${{ secrets.DD_APP_KEY }}
        test_search_query: 'tag:e2e-tests'

    - name: Skip Datadog Synthetic tests when credentials are missing
      if: steps.datadog_credentials.outputs.configured != 'true'
      run: echo "Skipped Datadog Synthetic tests: configure DD_API_KEY and DD_APP_KEY in GitHub Actions secrets to enable them."
